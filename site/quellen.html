<!DOCTYPE html>
<!--
  Sources and picture credits ("Quellen"), linked from the footer.

  The lists are built by js/sources.js from data/data.json, so they always
  match the data the app uses. All visible text comes from js/i18n.js.
-->
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quellen – Bundesrat und Bevölkerung</title>
  <meta name="theme-color" content="#f2f2ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2a14 14 0 0 0 0 28z' fill='%23eb6834'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/sources.js"></script>
</head>
<body>
  <main class="page text-page">

    <header class="intro">
      <p class="eyebrow"><a href="./" data-i18n="pageTitleShort"></a></p>
      <h1 data-i18n="sourcesTitle"></h1>
    </header>

    <p class="load-error" id="load-error" role="alert" hidden></p>

    <section class="box text-box">
      <h2 data-i18n="sourcesData"></h2>
      <ul class="source-list" id="sources-list"></ul>
      <p class="text-note" id="data-generated"></p>
    </section>

    <section class="box text-box">
      <h2 data-i18n="creditsTitle"></h2>
      <p data-i18n="creditsIntro"></p>
      <ul class="source-list credits-list" id="credits-list"></ul>
    </section>

    <p class="back-link"><a href="./" data-i18n="backHome"></a></p>

    <!-- The same footer on every page (index, quellen, datenschutz) -->
    <footer class="footer">
      <nav class="footer-links" data-i18n-label="footerLabel">
        <a href="quellen.html" data-i18n="sourcesLink" aria-current="page"></a>
        <a href="datenschutz.html" data-i18n="privacyLink"></a>
        <!-- Shown by analytics.js when Google Analytics is set up -->
        <button class="link-button" type="button" data-consent-settings hidden></button>
      </nav>
    </footer>
  </main>
</body>
</html>
