<!DOCTYPE html>
<!--
  Federal Council representation — single-page app.

  The HTML only holds the page structure. All visible text comes from
  js/i18n.js (elements with a data-i18n="key" attribute are filled in by
  js/app.js), and all numbers are calculated from data/data.json.
-->
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bundesrat und Bevölkerung</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f2f2ef">
  <!-- Start loading the font right away (it is referenced from the CSS) -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Analytics is loaded by js/analytics.js, and only after consent -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="page">

    <!-- Header ---------------------------------------------------------------->
    <!-- Title and intro text: site/content/<language>/intro.md (Markdown,
         js/content.js); its "# …" line is the page title (h1) -->
    <header class="intro">
      <div class="prose intro-text" data-content="intro" hidden></div>
    </header>

    <p class="load-error" id="load-error" role="alert" hidden></p>

    <!-- 1. Navigator: which Council is shown (buttons, slider, ← → keys).
         A direct child of <main> (a sticky element only sticks within its
         parent), so it stays at the top of the screen while scrolling
         through the whole page. Once the big score has scrolled past
         (above the screen), the score appears next to the dates
         ("75 % Gesamtübereinstimmung"); not while reading the intro. ---->
    <div class="panel-head" id="panel-head" hidden>
      <div class="panel-top">
        <button class="nav-btn" id="nav-prev" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="panel-middle">
          <!-- "1. Nov. 2017 – 31. Dez. 2018" (app.js) -->
          <h2 class="panel-period" id="nav-period" aria-live="polite"></h2>
          <p class="nav-score" aria-hidden="true">
            <span id="nav-score"></span>
            <span data-i18n="navScoreLabel"></span>
          </p>
        </div>
        <button class="nav-btn" id="nav-next" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <input class="range nav-range" id="nav-range" type="range" min="0" step="1">
      <div class="nav-ticks" id="nav-ticks" aria-hidden="true"></div>
    </div>

    <!-- 2. Overall score of the Council shown. The visible number is
         animated, so it is hidden from screen readers; #score-status
         announces the final value instead. --------------------------->
    <section class="score" id="score" aria-labelledby="score-label">
      <p class="score-label" id="score-label" data-i18n="scoreTitle"></p>
      <p class="score-value" id="score-value" aria-hidden="true">–</p>
      <p class="score-caption" id="score-caption"></p>
      <p class="score-caption" data-i18n="scoreCaption"></p>
      <p class="visually-hidden" id="score-status" aria-live="polite"></p>
    </section>

    <!-- 3. The seven members ------------------------------------------>
    <section class="council-panel" id="council-panel" aria-labelledby="nav-period" hidden>
      <ol class="council" id="council-list"></ol>
    </section>

    <!-- Editor for a person replacing a member (built by app.js) -->
    <section class="editor" id="editor" aria-labelledby="editor-title" hidden></section>

    <p class="warning" id="council-warning" hidden></p>

    <!-- 4. One box per comparison (gender, party, language, age,
         Grossregion; built by app.js), then the history: a step line
         chart of all scores since 1848 ------------------------------->
    <section class="compare" data-i18n-label="compareTitle">
      <div class="comparisons" id="comparisons"></div>
      <div class="history" id="history" role="group" aria-labelledby="history-title">
        <h3 class="history-title" id="history-title" data-i18n="historyTitle"></h3>
        <ul class="legend" id="history-legend"></ul>
        <div class="chart" id="history-chart"></div>
      </div>
    </section>

    <!-- Footer ---------------------------------------------------------------->
    <!-- The same footer on every page (index, quellen, datenschutz, kontakt) -->
    <footer class="footer">
      <nav class="footer-links" data-i18n-label="footerLabel">
        <a href="quellen.html" data-i18n="sourcesLink"></a>
        <a href="datenschutz.html" data-i18n="privacyLink"></a>
        <a href="kontakt.html" data-i18n="contactLink"></a>
        <!-- Shown by analytics.js when Google Analytics is set up -->
        <button class="link-button" type="button" data-consent-settings hidden></button>
      </nav>
    </footer>
  </main>

  <!-- One shared tooltip for the comparison bars -->
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <noscript>
    <p class="page">Diese Seite benötigt JavaScript.</p>
  </noscript>
</body>
</html>
