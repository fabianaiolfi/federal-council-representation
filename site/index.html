<!DOCTYPE html>
<!--
  Federal Council representation — single-page app.

  The HTML only holds the page structure. All visible text comes from
  js/i18n.js (elements with a data-i18n="key" attribute are filled in by
  js/app.js), and all numbers are calculated from data/data.json.
-->
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bundesrat und Bevölkerung</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#ffffff">
  <!-- Favicon: a small two-colour disc, inline so no extra file is needed -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2a14 14 0 0 0 0 28z' fill='%23eb6834'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">

  <!--
    Google Analytics (later iteration): paste the gtag.js snippet here.
  -->

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="page">

    <!-- Header ---------------------------------------------------------------->
    <header class="intro">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
    </header>

    <p class="load-error" id="load-error" role="alert" hidden></p>

    <!-- 1. Federal Council ---------------------------------------------------->
    <section class="block" aria-labelledby="council-title">
      <h2 id="council-title" data-i18n="councilTitle"></h2>
      <p class="subtitle" id="council-subtitle"></p>
      <ol class="council" id="council-list"></ol>
      <p class="warning" id="council-warning" hidden></p>
    </section>

    <!-- 2. Comparison: score, scenario picker, bars --------------------------->
    <section class="block" aria-labelledby="compare-title">
      <h2 id="compare-title" data-i18n="compareTitle"></h2>

      <!-- One radio group per departing member (filled in by app.js) -->
      <div id="scenarios"></div>

      <!-- The visible number is animated, so it is hidden from screen readers;
           #score-status announces the final value instead. -->
      <div class="score">
        <p class="score-label" data-i18n="scoreLabel"></p>
        <p class="score-value" id="score-value" aria-hidden="true">–</p>
        <p class="score-delta" id="score-delta" aria-hidden="true"></p>
        <p class="score-caption" data-i18n="scoreCaption"></p>
        <p class="visually-hidden" id="score-status" aria-live="polite"></p>
      </div>

      <ul class="legend" id="compare-legend"></ul>
      <div class="bars" id="compare-bars"></div>
    </section>

    <!-- Footer ---------------------------------------------------------------->
    <footer class="footer">
      <h2 class="footer-title" data-i18n="sourcesTitle"></h2>
      <ul>
        <li><a id="source-population" href="#" rel="noopener"></a></li>
        <li data-i18n="sourceCouncil"></li>
        <li id="data-generated"></li>
      </ul>
    </footer>
  </main>

  <!-- One shared tooltip for the comparison bars -->
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <noscript>
    <p class="page">Diese Seite benötigt JavaScript.</p>
  </noscript>
</body>
</html>
