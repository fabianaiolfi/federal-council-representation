# Check the web app and publish it on Cloudflare Pages.
#
#   push to main  -> public site  https://federal-council-representation.pages.dev
#   push to beta  -> beta site    https://beta.federal-council-representation.pages.dev
#   pull request  -> checks only, nothing is published
#
# The site is the folder site/ as it is in the repository (no build step);
# only site/js/config.js is written per site (Google Analytics ID).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

# One deployment per branch at a time; a newer push replaces a waiting one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: federal-council-representation
  WRANGLER: wrangler@4.151.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check data, files and JavaScript
        run: python3 scripts/check_site.py

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
      url: ${{ github.ref_name == 'main' && 'https://federal-council-representation.pages.dev' || 'https://beta.federal-council-representation.pages.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create the Cloudflare Pages project (first run only)
        run: |
          if ! npx --yes "$WRANGLER" pages deployment list --project-name="$PROJECT" > /dev/null 2>&1; then
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          fi
      # Google Analytics: the Measurement ID of this site (GitHub: Settings →
      # Environments → production / beta → variable GA_MEASUREMENT_ID).
      # Without it, the site has no analytics and no consent banner.
      - name: Write site/js/config.js
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GA_DEBUG: ${{ github.ref_name != 'main' }}
        run: |
          if [[ -n "$GA_MEASUREMENT_ID" && ! "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "GA_MEASUREMENT_ID must look like G-XXXXXXXXXX"; exit 1
          fi
          cat > site/js/config.js <<EOF
          // Written by the deploy pipeline (see the copy in the repository)
          export const GA_MEASUREMENT_ID = "$GA_MEASUREMENT_ID";
          export const GA_DEBUG = $GA_DEBUG;
          EOF
          cat site/js/config.js
      # The branch decides the site: main is production, beta a preview
      # with the fixed address beta.<project>.pages.dev
      - name: Publish site/
        run: >
          npx --yes "$WRANGLER" pages deploy site
          --project-name="$PROJECT"
          --branch="$GITHUB_REF_NAME"
          --commit-hash="$GITHUB_SHA"
